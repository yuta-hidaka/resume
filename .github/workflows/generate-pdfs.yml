name: Generate PDFs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generate-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      generate: ${{ steps.filter.outputs.generate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PDF inputs
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Keep this check running for every main push so a required workflow
          # check can complete even when the PDF job is skipped.
          if ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          generate=false
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/generate-pdfs.yml|astro.config.mjs|package.json|bun.lock|\
              scripts/generate-static-pdfs.mjs|scripts/sync-doc-assets.mjs|\
              src/data/profile/profile.ts|src/data/profile/types.ts|src/data/profile/validate.ts|\
              src/lib/docs/career.ts|src/lib/docs/career-html.ts|src/lib/docs/career-markdown.ts|\
              src/lib/docs/fonts-css.ts|src/lib/docs/html.ts|src/lib/docs/markdown-css.ts|\
              src/lib/docs/rirekisho.ts|src/pages/ja/pdf/*|src/pages/en/pdf/*|\
              docs/履歴書/images/*|public/docs/履歴書/images/*|public/fonts/*)
                generate=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BEFORE" "$GITHUB_SHA")
          echo "generate=$generate" >> "$GITHUB_OUTPUT"

  generate:
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Japanese fonts (documents use a system font stack)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Generate PDFs
        run: bun run generate:pdf

      - name: Commit & push PDFs (if changed)
        run: |
          if [[ -n "$(git status --porcelain public/pdf)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/pdf
            git commit -m "chore: regenerate PDFs"
            git push
          else
            echo "No PDF changes."
          fi
